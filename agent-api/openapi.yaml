openapi: 3.0.3
info:
  title: gymportal Agent API
  version: 1.0.0
  description: >
    Schnittstelle für KI-Agenten und Automatisierungen eines Studios. Das Studio
    ergibt sich aus dem Token. Schreibende Aufrufe liefern ohne "confirm": true
    nur eine Vorschau und ändern nichts.
servers:
  - url: /api/v1/agent
security:
  - bearer: []
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer }
  parameters:
    memberId: { name: memberId, in: path, required: true, schema: { type: integer } }
  schemas:
    Confirm:
      type: object
      properties:
        confirm: { type: boolean, description: "false oder leer: Vorschau. true: ausführen." }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
  responses:
    Ok: { description: "success=true, Nutzdaten unter data" }
    Queued: { description: "Spiegel: bestätigter Schreibaufruf wurde als Auftrag abgelegt (data.queued = true)" }
    Unauthenticated: { description: Token fehlt, ist unbekannt, widerrufen oder abgelaufen, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Dem Token fehlt das Recht (error.required_ability) }
    NotFound: { description: Kein solches Mitglied in diesem Studio }
paths:
  /health:
    get: { summary: Studio und Rechte des Tokens, responses: { '200': { $ref: '#/components/responses/Ok' }, '401': { $ref: '#/components/responses/Unauthenticated' } } }
  /mirror:
    get: { summary: "Spiegel: Stand und Alter der Daten, offene Aufträge", responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /mirror/import:
    post:
      summary: Studio-Export (JSON aus dem Portal) einspielen
      x-ability: mirror.write
      requestBody: { content: { application/json: { schema: { type: object, description: Der unveränderte Export } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: Kein gültiger Export oder Import abgelehnt } }
  /actions:
    get:
      summary: Aufträge, die im Portal auszuführen sind
      x-ability: actions.read
      parameters: [ { name: status, in: query, schema: { type: string, enum: [open, done, dismissed, all], default: open } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /actions/{actionId}/close:
    post:
      summary: Auftrag als erledigt oder verworfen markieren
      x-ability: actions.write
      parameters: [ { name: actionId, in: path, required: true, schema: { type: integer } } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [done, dismissed] } } } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { description: Bereits geschlossen } }
  /plans:
    get: { summary: Aktive Tarife, x-ability: plans.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members:
    get:
      summary: Mitglieder suchen
      x-ability: members.read
      parameters:
        - { name: search, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer } }
        - { name: per_page, in: query, schema: { type: integer, maximum: 100 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /members/lookup:
    get:
      summary: Genau ein Mitglied finden (match = unique, none, ambiguous)
      x-ability: members.read
      parameters:
        - { name: email, in: query, schema: { type: string } }
        - { name: member_number, in: query, schema: { type: string } }
        - { name: phone, in: query, schema: { type: string } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: Kein Suchkriterium } }
  /members/{memberId}:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: Stammdaten, x-ability: members.read, responses: { '200': { $ref: '#/components/responses/Ok' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch:
      summary: Kontaktdaten ändern
      x-ability: members.write
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Confirm'
                - type: object
                  properties:
                    phone: { type: string }
                    address: { type: string }
                    address_addition: { type: string }
                    postal_code: { type: string }
                    city: { type: string }
                    country: { type: string }
                    emergency_contact_name: { type: string }
                    emergency_contact_phone: { type: string }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: "Nichts zu ändern, ungültig, oder email gesendet (email_change_not_supported: die E-Mail ist der Login der Mitglieder-App)" } }
  /members/{memberId}/notes:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    post:
      summary: Notiz am Mitglied anlegen
      x-ability: members.write
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Confirm'
                - type: object
                  required: [text]
                  properties:
                    text: { type: string, maxLength: 1000 }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /members/{memberId}/contract:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: "Vertrag mit Kündigungstermin, Frist, Pause, Widerruf", x-ability: contracts.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members/{memberId}/contract/cancellation:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    post:
      summary: Ordentliche Kündigung zum nächstmöglichen Termin
      x-ability: contracts.write
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Confirm'
                - type: object
                  properties:
                    reason: { type: string, enum: [move, financial, health, dissatisfied, no_time, other] }
                    note: { type: string }
                    send_confirmation: { type: boolean }
                    expected_effective_date: { type: string, format: date, description: "Pflicht mit confirm=true: effective_date aus der Vorschau" }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '409': { description: "Bereits gekündigt, oder effective_date_changed: das Datum ist nicht mehr das der Vorschau" }, '422': { description: "Kein kündbarer Vertrag, oder expected_effective_date fehlt" } }
    delete:
      summary: Kündigung zurücknehmen
      x-ability: contracts.write
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Confirm' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: Keine offene Kündigung } }
  /members/{memberId}/contract/pause:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    post:
      summary: Vertrag pausieren
      x-ability: contracts.write
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/Confirm'
                - type: object
                  required: [start_date, end_date]
                  properties:
                    start_date: { type: string, format: date }
                    end_date: { type: string, format: date }
                    reason: { type: string }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: Nicht pausierbar oder Datum ungültig } }
  /members/{memberId}/contract/resume:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    post:
      summary: Pause beenden
      x-ability: contracts.write
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Confirm' } } } }
      responses: { '200': { $ref: '#/components/responses/Ok' }, '422': { description: Nicht pausiert } }
  /members/{memberId}/access:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: "Zutritt: sollte es gehen, und wenn nicht, warum", x-ability: access.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members/{memberId}/check-ins:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: Letzte Besuche, x-ability: access.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /members/{memberId}/payments:
    parameters: [ { $ref: '#/components/parameters/memberId' } ]
    get: { summary: Zahlungen mit Summe der fehlgeschlagenen, x-ability: payments.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /occupancy:
    get:
      summary: Besuche je Wochentag und Stunde
      x-ability: stats.read
      parameters: [ { name: days, in: query, schema: { type: integer, default: 56 } } ]
      responses: { '200': { $ref: '#/components/responses/Ok' } }
  /stats:
    get: { summary: "Kennzahlen des Studios (Umsatz nur mit payments.read)", x-ability: stats.read, responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /insights/inactive-members:
    get:
      summary: Mitglieder mit laufendem Vertrag ohne Besuch seit N Tagen
      x-ability: stats.read
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses: { '200': { $ref: '#/components/responses/Ok' } }
